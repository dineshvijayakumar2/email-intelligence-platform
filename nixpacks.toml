# Nixpacks configuration for Railway deployment

[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"

[phases.setup]
nixPkgs = ["gcc"]
cmds = ["MISE_PYTHON_GITHUB_ATTESTATIONS=false mise install python@3.11"]

[phases.install]
cmds = ["cd backend && pip install --upgrade pip && pip install -r requirements.txt"]

[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"