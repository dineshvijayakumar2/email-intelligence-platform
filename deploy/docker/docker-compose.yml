version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.production
    container_name: emailintel-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - ../../config/production/.env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - emailintel-network
    volumes:
      - email-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: emailintel-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - emailintel-network

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.production
    container_name: emailintel-worker
    command: python3 -m src.workers.email_processor
    environment:
      - PYTHON_ENV=production
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=4
    env_file:
      - ../../config/production/.env
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - emailintel-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: emailintel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - emailintel-network

networks:
  emailintel-network:
    driver: bridge

volumes:
  email-data:
  redis-data: