[build]
builder = "nixpacks"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Backend API Service
[[services]]
name = "backend-api"
source = "backend"
buildCommand = "pip install -r ../requirements.txt"
startCommand = "python3 -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 30

# Persistent volume for downloads - survives redeployments
[[services.volumes]]
name = "downloads"
mountPath = "/data/downloads"
sizeGB = 10

# Frontend Service
[[services]]
name = "frontend"
source = "frontend"
buildCommand = "npm install && npm run build"
startCommand = "npx serve -s build -l ${PORT:-3000}"
healthcheckPath = "/"

# Job Worker — claims and executes processing_jobs via DB lease
[[services]]
name = "job-worker"
source = "backend"
buildCommand = "pip install -r ../requirements.txt"
startCommand = "python3 -m src.workers.job_runner"
replicas = 2